name: Build IPA or tweak 

# Verify the tweak compiles on every pull request and push to main by running
# the project's own build.sh.
#
# CI ships no decrypted Facebook IPA (it cannot, for legal reasons), so build.sh
# builds the .deb and skips the injection step. The check therefore verifies
# that the package compiles cleanly.
#
# Optional manual runs (workflow_dispatch):
#   Provide a direct link to a *decrypted* Facebook .ipa and the workflow will
#   also download it, inject the freshly built tweak into it, and upload the
#   patched IPA as an artifact. The link is fetched at run time and is never
#   stored in the repo.

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Facebook .ipa (leave empty to only build the .deb)"
        required: false
        type: string
        default: ""

# Cancel an in-progress run when new commits are pushed to the same PR/branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build tweak (.deb)
    # macOS so Theos uses Xcode's toolchain and iOS SDK directly — far more
    # reliable than a Linux cross-compiler + downloaded SDK.
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos build dependencies
        run: brew install ldid dpkg xz

      - name: Set up Theos
        run: git clone --quiet --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Build
        run: ./build.sh

      - name: Upload built packages
        uses: actions/upload-artifact@v4
        with:
          name: Facebook-Plus
          path: packages/Facebook-Plus-v*.deb
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------------------
      # Optional: inject the freshly built tweak into a user-supplied
      # decrypted IPA. Only runs on workflow_dispatch when a URL was given;
      # push/PR runs just build the .deb.
      # ---------------------------------------------------------------------
      - name: Install injection tool (Azule)
        if: inputs.ipa_url != ''
        run: |
          # Azule (Al4ise/Azule) is the standard CLI injector: it accepts the
          # .deb directly, copies the dylib + filter plist into the app,
          # patches the Mach-O load commands, and fake-signs with ldid.
          # NOTE: the `cyan` package on PyPI is an unrelated project-template
          # package with no executable — do not use it.
          if ! brew install azule; then
            echo "Homebrew formula unavailable — falling back to source install…"
            git clone --quiet --depth 1 https://github.com/Al4ise/Azule.git "$HOME/Azule"
            chmod +x "$HOME/Azule/Azule"
            echo "$HOME/Azule" >> "$GITHUB_PATH"
          fi

      - name: Download decrypted IPA
        if: inputs.ipa_url != ''
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          echo "Fetching decrypted IPA from provided link…"
          curl --fail --location --connect-timeout 30 --retry 3 --retry-delay 5 \
            --output decrypted.ipa "$IPA_URL"
          # Sanity check: an .ipa is just a zip archive.
          unzip -t decrypted.ipa > /dev/null
          echo "Downloaded $(du -h decrypted.ipa | cut -f1)"

      - name: Inject tweak into IPA
        if: inputs.ipa_url != ''
        run: |
          set -euo pipefail

          # Resolve the injector (brew installs it as `azule`; the source
          # checkout ships an executable named `Azule`).
          if command -v azule >/dev/null 2>&1; then
            AZULE="$(command -v azule)"
          elif [ -x "$HOME/Azule/Azule" ]; then
            AZULE="$HOME/Azule/Azule"
          else
            echo "::error::Azule not found after installation"
            exit 1
          fi
          echo "Using injector: $AZULE"

          # Pick the .deb that was just built (newest, in case several exist).
          DEB="$(ls -t packages/Facebook-Plus-v*.deb | head -n1)"
          echo "Injecting ${DEB} into decrypted.ipa…"

          # Absolute output path: a bare filename would land in Azule's
          # default output folder, breaking the artifact upload.
          "$AZULE" -i "$PWD/decrypted.ipa" -t "$PWD/$DEB" -o "$PWD/Facebook-Plus.ipa"

      - name: Upload patched IPA
        if: inputs.ipa_url != ''
        uses: actions/upload-artifact@v4
        with:
          name: Facebook-Plus-IPA
          path: Facebook-Plus.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Job summary
        if: inputs.ipa_url != ''
        run: |
          echo "## ✅ Patched IPA built" >> "$GITHUB_STEP_SUMMARY"
          echo "The tweak was injected into the provided decrypted IPA. Download **Facebook-Plus-IPA** from this run's artifacts." >> "$GITHUB_STEP_SUMMARY"
